[pytest]
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results
markers =
    p0: P0 priority tests (login + cart + checkout + bug regression)
    p1: P1 priority tests (product detail + state machine + admin CRUD)
    p2: P2 priority tests (address + favorites + permissions)
    p3: P3 priority tests (buyer2 flow + exploratory)
    smoke: Smoke tests
    bug_regression: Bug regression verification tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*